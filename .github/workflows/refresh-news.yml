name: Refresh trusted news cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - refresh_news.py
      - .github/workflows/refresh-news.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trusted RSS feeds
        run: python refresh_news.py
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh trusted news cache"
            git push
          fi
